<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title data-i18n="misc.fractal-renderer"></title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0b0d12;
    --panel: rgba(17, 19, 26, .86);
    --line: rgba(255, 255, 255, .09);
    --line-strong: rgba(255, 255, 255, .17);
    --text: #ece8df;
    --muted: #9c9a92;
    --faint: #6f6e68;
    --accent: #82cbbe;
    --accent-ink: #0b0d12;
    --warn: #e2b04c;
    --bad: #e4706a;
    /* nur Systemschriften: die App lädt nichts von fremden Servern */
    --font-ui: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    --font-mono: ui-monospace, 'Cascadia Mono', 'Segoe UI Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace;
    --radius: 10px;
    --rail: 46px;   /* Breite der Bereichsleiste am rechten Rand */
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 13px/1.45 var(--font-ui);
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
  }
  #stage { position: fixed; inset: 0; background: var(--bg); }
  #stage canvas {
    width: 100%; height: 100%; display: block;
    touch-action: none; user-select: none; -webkit-user-select: none;
    cursor: grab;
  }
  #stage canvas:active { cursor: grabbing; }

  .panel {
    position: fixed; top: 0; right: var(--rail); bottom: 0; width: 356px;
    display: flex; flex-direction: column;
    background: var(--panel);
    -webkit-backdrop-filter: blur(16px) saturate(120%);
    backdrop-filter: blur(16px) saturate(120%);
    border-left: 1px solid var(--line);
    box-shadow: -14px 0 48px rgba(0, 0, 0, .35);
    z-index: 5;
  }
  .panel-head {
    display: flex; align-items: center; gap: 8px;
    padding: 12px 12px 12px 16px;
    border-bottom: 1px solid var(--line);
    flex: none;
  }
  .panel.collapsed .panel-head { border-bottom: 0; }
  .brand { display: flex; align-items: center; gap: 8px; min-width: 0; flex: 1 1 auto; }
  .wordmark { font-weight: 600; letter-spacing: .01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .badge {
    font: 500 10.5px/1 var(--font-mono);
    letter-spacing: .07em; text-transform: uppercase;
    padding: 4px 6px; border-radius: 4px;
    border: 1px solid var(--line-strong);
    color: var(--muted); white-space: nowrap;
  }
  .badge.gpu { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 45%, transparent); }
  .badge.gl { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 45%, transparent); }
  .badge.none { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 45%, transparent); }
  .zoom-read {
    margin-left: auto; flex: none;
    font: 12px var(--font-mono);
    font-variant-numeric: tabular-nums;
    color: var(--muted); white-space: nowrap;
  }
  .zoom-read sup { font-size: 9px; }
  .icon-btn {
    flex: none; width: 28px; height: 28px;
    display: grid; place-items: center;
    border: 0; border-radius: 6px;
    background: transparent; color: var(--muted); cursor: pointer;
  }
  .icon-btn:hover { background: rgba(255, 255, 255, .06); color: var(--text); }
  .panel-head .icon-btn { display: none; }   /* am PC übernimmt der Griff an der Schubladenkante */
  .icon-btn svg { transition: transform .2s ease; }
  .panel.collapsed .icon-btn svg { transform: rotate(180deg); }
  .panel-body {
    flex: 1 1 auto; min-height: 0;
    overflow-y: auto; padding: 0 16px 16px;
    display: flex; flex-direction: column;
    scrollbar-width: thin;
  }
  .row {
    padding: 16px 0 18px; border-bottom: 1px solid var(--line);
    display: flex; flex-direction: column; gap: 11px;
  }
  .sec-title {
    margin: 0 0 1px; font: 600 10.5px var(--font-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--faint);
    display: flex; justify-content: space-between; align-items: baseline;
  }
  .sec-title .val { text-transform: none; letter-spacing: 0; font: 12px var(--font-mono); color: var(--muted); }
  .row:last-child { border-bottom: 0; }
  .lbl {
    display: flex; justify-content: space-between; align-items: baseline; gap: 8px;
    color: var(--muted); font-size: 12px; letter-spacing: .02em;
  }
  .val { color: var(--text); }
  .mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

  .seg {
    display: grid; grid-template-columns: 1fr 1fr; gap: 3px;
    background: rgba(255, 255, 255, .05);
    border: 1px solid var(--line); border-radius: 7px; padding: 3px;
  }
  .seg button {
    border: 0; background: transparent; color: var(--muted);
    font: 500 13px var(--font-ui); padding: 7px; border-radius: 5px; cursor: pointer;
  }
  .seg button.on { background: var(--text); color: var(--accent-ink); }
  .seg.seg-4 { grid-template-columns: repeat(4, 1fr); }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .grid2 > div, .pal-cell { display: flex; flex-direction: column; gap: 7px; min-width: 0; }
  #posterResRow { display: flex; flex-direction: column; gap: 4px; }
  .lbl.crop-line { align-items: center; }
  .crop-line .seg { margin-left: auto; grid-template-columns: auto auto; }
  .crop-line .seg button { padding: 6px 12px; }
  .crop-line .val { margin-left: 4px; }
  .crop-line .crop-edit { flex: none; width: 34px; height: 34px; padding: 0; display: grid; place-items: center; }
  .seg.seg-4 button { padding: 6px 4px; font-variant-numeric: tabular-nums; }
  /* adaptive Glättung: Voreinstellungen abgesetzt über den Reglern, Regler im selben Takt wie c und z₀ */
  #aaAdaptRow { display: flex; flex-direction: column; gap: 7px; }
  #aaPresets { margin-bottom: 4px; }

  /* Wertanzeigen sind Eingabefelder: dieselbe Optik wie die Zahlenfelder bei c und z₀, nur schmaler und rechtsbündig */
  input.wert {
    flex: none; width: 96px; text-align: right;
    background: rgba(255, 255, 255, .05); color: var(--text);
    border: 1px solid var(--line-strong); border-radius: 6px;
    padding: 3px 6px; font: 12px var(--font-mono); font-variant-numeric: tabular-nums;
  }
  input.wert:disabled { opacity: .45; }
  .sec-title input.wert { margin: -3px 0; }
  .val-zusatz { margin-left: auto; padding-right: 8px; color: var(--muted); font-size: 11.5px; }
  /* Gesetz der Nähe: Beschriftung und Feld gehören zu ihrem Regler, darum steht die nächste Gruppe deutlich ab */
  .wertzeile { margin-top: 13px; align-items: center; }
  .row > .wertzeile:first-child, .grid2 .wertzeile, #p2eNRow > .wertzeile { margin-top: 0; }
  input[type=range] { width: 100%; accent-color: var(--accent); margin: 3px 0 5px; }
  input[type=range]:disabled { opacity: .45; }
  select, .julia-c input[type=number] {
    width: 100%;
    background: rgba(255, 255, 255, .05); color: var(--text);
    border: 1px solid var(--line-strong); border-radius: 6px;
    padding: 7px 8px; font: 13px var(--font-ui);
  }
  select option { background: #14161d; color: var(--text); padding: 4px 6px; }
  select optgroup { background: #14161d; color: var(--muted); font-weight: 600; font-style: normal; letter-spacing: .02em; }
  .sel-hidden { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
  .crop-bar .menu-btn { width: auto; }
  .menu-btn:disabled { opacity: .5; cursor: default; }
  .menu-btn {
    width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 8px;
    background: rgba(255, 255, 255, .05); border: 1px solid var(--line-strong); border-radius: 6px;
    padding: 7px 8px 7px 10px; color: var(--text); font: 13px var(--font-ui); cursor: pointer; text-align: left;
  }
  .menu-btn:hover { background: rgba(255, 255, 255, .08); }
  .menu-btn svg { flex: none; color: var(--muted); }
  .menu {
    position: fixed; z-index: 70; padding: 6px 0;   /* über Unterseite (45), Einwilligung (40) und Seitenleiste (60) */
    background: #14161d; border: 1px solid var(--line-strong); border-radius: 8px;
    box-shadow: 0 16px 48px rgba(0, 0, 0, .55); overflow-y: auto; scrollbar-width: thin;
  }
  .menu h4 {
    margin: 12px 12px 4px; padding-top: 12px; border-top: 1px solid var(--line);
    font: 600 10.5px var(--font-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted);
  }
  .menu h4:first-child { margin-top: 4px; padding-top: 0; border-top: 0; }
  .menu button {
    display: block; width: 100%; text-align: left; background: transparent; border: 0;
    color: var(--text); font: 13px var(--font-ui); padding: 7px 14px; cursor: pointer;
  }
  .menu button:hover, .menu button:focus-visible, .menu button.hl { background: rgba(255, 255, 255, .08); outline: none; }
  .menu button.on { color: var(--accent); }
  .menu button.on::before { content: '▸ '; color: var(--accent); }
  .chk {
    display: flex; gap: 8px; align-items: center;
    color: var(--muted); font-size: 12.5px; cursor: pointer;
  }
  .chk input { accent-color: var(--accent); margin: 0; width: 15px; height: 15px; }
  .julia-c { display: flex; flex-direction: column; gap: 7px; padding-top: 4px; }
  .julia-c input[type=number] { width: 112px; font: 12.5px var(--font-mono); padding: 4px 7px; text-align: right; }
  .julia-c input::-webkit-outer-spin-button, .julia-c input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .julia-c input[type=number] { -moz-appearance: textfield; appearance: textfield; }

  .btns { flex-direction: row; }
  .ghost, .primary {
    flex: 1; border-radius: 7px; padding: 8px 10px;
    font: 500 13px var(--font-ui); cursor: pointer;
    text-align: center; text-decoration: none; line-height: 1.3;
  }
  .ghost { background: transparent; border: 1px solid var(--line-strong); color: var(--text); }
  .ghost:hover { background: rgba(255, 255, 255, .06); }
  .primary { background: var(--accent); border: 1px solid var(--accent); color: var(--accent-ink); }
  .primary:hover { filter: brightness(1.06); }
  button:disabled { opacity: .5; cursor: default; }

  .track { height: 3px; background: rgba(255, 255, 255, .08); border-radius: 2px; overflow: hidden; }
  .fill { height: 100%; background: var(--accent); width: 0%; transition: width .15s linear; }
  .hint { color: var(--faint); font-size: 11.5px; line-height: 1.45; }
  .state { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .coords { font-size: 11.5px; color: var(--muted); word-break: break-all; line-height: 1.5; white-space: pre-line; }


  .modal {
    position: fixed; inset: 0; z-index: 10;
    background: rgba(5, 6, 9, .78);
    display: flex; justify-content: center; padding: 16px;
    overflow-y: auto; overscroll-behavior: contain;   /* höhere Karten als das Bild bleiben scrollbar */
  }
  #linkText { width: 100%; box-sizing: border-box; font: 12px var(--font-mono); background: rgba(255, 255, 255, .04); color: var(--text); border: 1px solid var(--line-strong); border-radius: 8px; padding: 8px 10px; resize: vertical; word-break: break-all; }
  .modal-card {
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    padding: 12px; max-width: min(94vw, 960px); width: 100%;
    margin: auto;   /* zentriert wie bisher, schneidet aber nichts ab, wenn die Karte höher ist als das Bild */
    display: flex; flex-direction: column; gap: 10px;
  }
  .modal-card img { max-width: 100%; max-height: 68vh; border-radius: 6px; display: block; margin: 0 auto; }
  .modal-card .btns { display: flex; gap: 8px; }
  .pal-ed { display: flex; flex-direction: column; gap: 9px; }
  .pal-ed canvas { width: 100%; height: 28px; border-radius: 6px; border: 1px solid var(--line); display: block; }
  .pal-ed .btns { display: flex; gap: 6px; align-items: center; }
  .pal-ed .btns .chk { flex: 1; }
  .pal-ed input[type=text] { width: 58%; font: 13px var(--font-ui); padding: 6px 8px; }
  .pe-stops { display: flex; flex-direction: column; gap: 6px; }
  .pe-stop { display: grid; grid-template-columns: 38px 1fr 44px 28px; gap: 6px; align-items: center; }
  .pe-stop input[type=color] { width: 38px; height: 28px; padding: 0; border: 1px solid var(--line); border-radius: 6px; background: none; cursor: pointer; }
  .pe-stop input[type=range] { margin: 0; }
  .pe-stop .pos { font: 12px var(--font-mono); color: var(--muted); text-align: right; }
  .pe-stop button { width: 28px; height: 28px; padding: 0; flex: none; }
  /* Quilez-Palette: vier Größen a, b, c, d mit je einem Regler für Rot, Grün und Blau */
  .pe-quilez { display: flex; flex-direction: column; gap: 8px; }
  .pe-q { display: flex; flex-direction: column; gap: 2px; }
  .pe-rgb { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .pe-rgb input[type=range] { margin: 2px 0 4px; accent-color: var(--kanal); }
  .pe-rgb input:nth-child(1) { --kanal: #e0625a; }
  .pe-rgb input:nth-child(2) { --kanal: #5cc26e; }
  .pe-rgb input:nth-child(3) { --kanal: #5b8ee6; }
  /* zweidimensionale Farbschemata: Vorschau als Fläche, je Verlauf ein Block */
  .pal-ed canvas.pe2-bild { height: auto; aspect-ratio: 2 / 1; }
  .pe2-verlauf, .pe2-v { display: flex; flex-direction: column; gap: 7px; }
  .pe2-v { padding-top: 4px; }
  .pe2-v .lbl select, .pe2-v .lbl .menu-btn { flex: none; width: 56%; }
  .pe2-verlauf > .lbl select, .pe2-verlauf > .lbl .menu-btn { flex: none; width: 56%; }
  .pe2-mehr > summary { cursor: pointer; color: var(--muted); font-size: 12.5px; list-style: none; display: flex; align-items: center; gap: 6px; padding: 4px 0; width: max-content; }
  .pe2-mehr > summary::-webkit-details-marker { display: none; }
  .pe2-mehr > summary::before { content: '▸'; font-size: 11px; transition: transform .15s; }
  .pe2-mehr[open] > summary::before { transform: rotate(90deg); }
  .pe2-mehr > summary:hover, .pe2-mehr > summary:focus-visible { color: var(--text); }
  .pe2-mehr-inhalt { display: flex; flex-direction: column; gap: 7px; padding-top: 6px; }
  .pe2-st { display: flex; flex-direction: column; gap: 6px; padding-top: 4px; }
  .poster-card { max-width: 460px; }
  /* Auf niedrigen Schirmen (Handy im Artifact-Rahmen) muss die Karte ohne Rollen bedienbar bleiben: Abstände,
     Schrift und Vorschaubild rücken zusammen, damit Ausschnitt, Auflösung, Infozeile und Knöpfe ins Bild passen. */
  @media (max-height: 780px) {
    .poster-card { gap: 8px; padding: 10px 12px; }
    .poster-card h2 { font-size: 14px; }
    .poster-card .thumb { max-height: 110px; }
  }
  @media (max-height: 700px) {
    .poster-card { gap: 6px; }
    .poster-card h2 { margin: 0; }
    .poster-card select, .poster-card .menu-btn, .poster-card input[type=number] { padding-top: 5px; padding-bottom: 5px; }
    .poster-card .ghost, .poster-card .primary { padding-top: 6px; padding-bottom: 6px; }
    .poster-card .hint, .poster-card .state { font-size: 11px; line-height: 1.35; }
    .poster-card .lbl { font-size: 11px; }
    .poster-card .thumb { max-height: 84px; }
  }
  .poster-card h2 { margin: 0 0 2px; font-size: 15px; font-weight: 600; }
  #seq { background: rgba(255, 255, 255, .05); color: var(--text); border: 1px solid var(--line-strong); border-radius: 6px; padding: 5px 8px; font: 12.5px var(--font-mono); letter-spacing: .08em; }
  .poster-card input[type=number] {
    width: 100%; background: rgba(255, 255, 255, .05); color: var(--text);
    border: 1px solid var(--line-strong); border-radius: 6px; padding: 7px 8px; font: 13px var(--font-mono);
  }
  .poster-card .thumb { max-height: 140px; width: auto; max-width: 100%; border-radius: 6px; display: block; margin: 0 auto; }
  #crop { position: fixed; inset: 0; z-index: 6; pointer-events: none; }
  #cropBox {
    position: absolute; box-sizing: border-box;
    border: 1.5px solid rgba(255, 255, 255, .95);
    box-shadow: 0 0 0 200vmax rgba(5, 6, 9, .55);
    pointer-events: auto; cursor: move; touch-action: none;
  }
  #cropBox::before, #cropBox::after { content: ''; position: absolute; border: 0 dashed rgba(255, 255, 255, .28); pointer-events: none; }
  #cropBox::before { left: 33.333%; right: 33.333%; top: 0; bottom: 0; border-width: 0 1px; }
  #cropBox::after { top: 33.333%; bottom: 33.333%; left: 0; right: 0; border-width: 1px 0; }
  #cropBox .h {
    position: absolute; width: 22px; height: 22px; box-sizing: border-box;
    border: 2px solid #fff; background: rgba(11, 13, 18, .8); border-radius: 3px;
    pointer-events: auto; touch-action: none;
  }
  #cropBox .h[data-h=nw] { left: -11px; top: -11px; cursor: nwse-resize; }
  #cropBox .h[data-h=se] { right: -11px; bottom: -11px; cursor: nwse-resize; }
  #cropBox .h[data-h=ne] { right: -11px; top: -11px; cursor: nesw-resize; }
  #cropBox .h[data-h=sw] { left: -11px; bottom: -11px; cursor: nesw-resize; }
  .crop-label {
    position: absolute; left: 0; top: 100%; margin-top: 6px; white-space: nowrap;
    font: 11.5px var(--font-mono); color: var(--text); background: rgba(11, 13, 18, .75);
    padding: 3px 6px; border-radius: 4px; pointer-events: none;
  }
  .crop-bar {
    position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%);
    display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: center;
    max-width: calc(100vw - 24px); padding: 8px; border-radius: 10px;
    background: var(--panel); border: 1px solid var(--line); box-shadow: 0 12px 40px rgba(0, 0, 0, .38);
    -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
    pointer-events: auto;
  }
  .crop-bar select { width: auto; }
  #cropFmtMenu { min-width: 240px; }   /* benannte Formen wie „Goldener Schnitt · 1,618:1“ ohne Umbruch */
  .crop-bar .ghost, .crop-bar .primary { flex: none; }

  .fatal {
    position: fixed; inset: 0; z-index: 20; display: grid; place-items: center;
    padding: 24px; text-align: center; background: var(--bg);
  }
  .fatal div { max-width: 46ch; }
  .fatal h1 { font-size: 18px; margin: 0 0 8px; }
  .fatal p { color: var(--muted); margin: 0; }

  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  @media (prefers-reduced-motion: reduce) {
    .icon-btn svg, .fill { transition: none; }
  }
  /* Seitenleiste unten rechts: Rechtliches und Sprache */
  .site-bar {
    position: fixed; left: 12px; bottom: 10px; z-index: 6;
    display: flex; gap: 1px; align-items: center;
    background: rgba(17, 19, 26, .72); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
    border: 1px solid var(--line); border-radius: 8px; padding: 2px 4px;
  }
  .site-bar button, .site-bar a { background: transparent; border: 0; color: var(--muted); font: 11.5px var(--font-ui); padding: 5px 7px; cursor: pointer; border-radius: 5px; text-decoration: none; }
  .site-bar button:hover, .site-bar a:hover { color: var(--text); background: rgba(255, 255, 255, .06); }
  .site-bar .menu-btn, .site-bar select { width: auto; background: transparent; border: 0; color: var(--muted); font: 11.5px var(--font-ui); padding: 4px 6px 4px 8px; gap: 5px; }
  .site-bar .menu-btn:hover, .site-bar select:hover { color: var(--text); background: rgba(255, 255, 255, .06); }
  .site-bar .menu-btn svg { width: 10px; height: 10px; }
  /* Burger-Menü: Knopf oben rechts, Seitenleiste fliegt von rechts ein */
  .burger {
    position: fixed; top: 14px; left: 14px; z-index: 50; width: 40px; height: 40px;   /* auch über den Unterseiten (45) */
    display: grid; place-items: center; cursor: pointer;
    border: 1px solid var(--line); border-radius: 10px; color: var(--text);
    background: var(--panel); -webkit-backdrop-filter: blur(16px) saturate(120%); backdrop-filter: blur(16px) saturate(120%);
    box-shadow: 0 8px 24px rgba(0, 0, 0, .3);
  }
  .burger:hover { background: rgba(30, 33, 42, .92); }
  .drawer-backdrop { position: fixed; inset: 0; z-index: 59; background: rgba(5, 6, 9, .45); }
  .drawer {
    position: fixed; top: 0; left: 0; bottom: 0; z-index: 60; width: min(440px, 92vw);
    background: #14161d; border-right: 1px solid var(--line-strong); box-shadow: 16px 0 48px rgba(0, 0, 0, .5);
    transform: translateX(calc(-100% - 8px)); transition: transform .28s ease;
    display: flex; flex-direction: column;
  }
  .drawer.open { transform: translateX(0); }
  .drawer-head { display: flex; align-items: center; gap: 6px; padding: 12px 12px 12px 18px; border-bottom: 1px solid var(--line); flex: none; }
  .drawer-head strong { flex: 1; font-size: 14px; }
  .drawer-body { overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 16px; scrollbar-width: thin; }
  .drawer-body .lbl { margin: 0; }
  /* schlichte Navigationsliste: Text, Trennlinien, kein Knopf-Look */
  .drawer-nav { display: flex; flex-direction: column; border-top: 1px solid var(--line); }
  .drawer-nav button, .drawer-nav a {
    display: block; width: 100%; text-align: left; text-decoration: none;
    background: none; border: 0; border-bottom: 1px solid var(--line); border-radius: 0;

<script>
/*
 * Fraktal-Renderer: alles in einer Datei, damit die Seite ohne Server und offline läuft.
 * Aufbau des Skripts (Abschnittsköpfe der Form „//  Name“ zwischen Trennlinien):
 *
 *   Sprache
 *   Konstanten
 *   Double-Double-Arithmetik (etwa 32 Dezimalstellen)
 *   Paletten
 *   Shader-Quellen
 *   WebGPU-Renderer
 *   WebGL2-Renderer (Fallback)
 *   Zustand
 *   Referenzbahnen (CPU, Double-Double)
 *   Ansicht
 *   Render-Schleife
 *   Statusanzeige
 *   Größe & Kacheln
 *   Renderer-Start
 *   Eingabe
 *   Ansicht im URL-Hash (teilbare Links für die Einzeldatei)
 *   Website-Rahmen: Menü, Unterseiten, Cookie-Einwilligung
 *   Bedienfeld
 *   Los geht's
 *   Dateien: Parameter in Bildern und als JSON, Wiederherstellen
 *   Bildexport (Poster)
 *   Texte der Unterseiten (Über die App, Impressum, Datenschutz)
 *
 * Die Rechtstexte am Ende sind unveränderte Daten; der Code steht davor.
 */
(() => {
'use strict';

// ============================================================
//  Sprache
// ============================================================
// Jeder Text steht genau einmal im Wörterbuch TEXTE, unter einem Schlüssel wie 'colour.colour-density', in allen Sprachen.
// Wer einen Text schreibt, holt ihn mit t(schlüssel, werte …); Platzhalter {0}, {1} … nehmen Zahlen und Namen auf.
// Texte im Markup tragen ihren Schlüssel als Marke (data-i18n), zeigeTexte() beschriftet sie beim Start und bei jedem Wechsel.
// Nach dem Wechsel beschriften die Bereiche ihre veränderlichen Texte neu (sprachGewechselt im Bedienfeld). Fehlende
// Schlüssel sammelt FEHLENDE_TEXTE; ein Test prüft, dass die Liste leer bleibt. Kein Beobachter, kein Timer, kein Nachübersetzen.
let LANG = /^de/i.test(navigator.language || '') ? 'de' : 'en';   // Englisch ist die Vorgabe; Deutsch nur für deutschsprachige Browser
try { const l = localStorage.getItem('fractal.lang'); if (l === 'de' || l === 'en') LANG = l; } catch (e) { /* egal */ }   // die eigene Wahl geht vor
// Jeder Text steht genau einmal hier, unter seinem Schlüssel, in allen Sprachen. Platzhalter {0}, {1} … füllt t().
const TEXTE = {
  // cloud
  'cloud.parameter': { de: 'Parameter {0}', en: 'Parameter {0}' },
  // colour
  'colour.angle': { de: 'Winkel', en: 'Angle' },
  'colour.animate-colours': { de: 'Farben wandern lassen', en: 'Animate colours' },
  'colour.black': { de: 'Schwarz', en: 'Black' },
  'colour.boundary': { de: 'Grenze', en: 'Boundary' },
  'colour.colour': { de: 'Farbe', en: 'Colour' },
  'colour.colour-density': { de: 'Farbdichte', en: 'Colour density' },
  'colour.colour-offset': { de: 'Farbversatz', en: 'Colour offset' },
  'colour.colour-palette': { de: 'Farbpalette', en: 'Colour palette' },
  'colour.colouring-by': { de: 'Färbung nach', en: 'Colouring by' },
  'colour.complex-lyapunov-exponent': { de: 'Komplexer Lyapunov-Exponent', en: 'Complex Lyapunov exponent' },
  'colour.compression': { de: 'Stauchung', en: 'Compression' },
  'colour.compression-relief': { de: 'Stauchung + Relief', en: 'Compression + relief' },
  'colour.compression-slider': { de: 'Stauchung (Regler)', en: 'Compression (slider)' },
  'colour.contour-lines': { de: 'Höhenlinien', en: 'Contour lines' },
  'colour.cross-trap-pickover': { de: 'Bahnfalle Kreuz (Pickover)', en: 'Cross trap (Pickover)' },
  'colour.cross-trap-two-values': { de: 'Bahnfalle Kreuz, zwei Werte', en: 'Cross trap, two values' },
  'colour.dark': { de: 'Dunkel', en: 'Dark' },
  'colour.distance': { de: 'Abstand', en: 'Distance' },
  'colour.double-logarithmic': { de: 'Doppelt logarithmisch', en: 'Double logarithmic' },
  'colour.edge-lines': { de: 'Randlinien', en: 'Edge lines' },
  'colour.edge-width': { de: 'Randbreite', en: 'Edge width' },
  'colour.edit-colour-scheme': { de: 'Farbschema bearbeiten …', en: 'Edit colour scheme …' },

const WGSL_FRACTAL = /* wgsl */`

override BLA: u32 = 0u;          // bilineare Näherung: Iterationsblöcke überspringen, solange δ klein gegen die Referenz bleibt

@vertex fn vs(@builtin(vertex_index) vi: u32) -> @builtin(position) vec4f {
  let x = f32((vi & 1u) << 2u) - 1.0;
  let y = f32((vi & 2u) << 1u) - 1.0;
  return vec4f(x, y, 0.0, 1.0);

fn Zat(i: u32) -> vec2f { return textureLoad(orbit, vec2i(i32(i % P.texW), i32(i / P.texW)), 0).xy; }
fn blaR4at(i: u32) -> f32 { return textureLoad(blaR4, vec2i(i32(i % P.texW), i32(i / P.texW)), 0).x; }
fn blaRad(i: u32) -> f32 { return textureLoad(blaR, vec2i(i32(i % P.texW), i32(i / P.texW)), 0).x; }
fn blaFac(i: u32) -> vec4f { return textureLoad(blaAB, vec2i(i32(i % P.texW), i32(i / P.texW)), 0); }

fn cexp(z: vec2f) -> vec2f { let e = exp(clamp(z.x, -80.0, 80.0)); return vec2f(e * cos(z.y), e * sin(z.y)); }
fn M(w: vec2f) -> mat2x2f { return mat2x2f(vec2f(w.x, w.y), vec2f(-w.y, w.x)); }        // komplexe Multiplikation als Matrix
// Färbung nach Lyapunov-Exponent: je Schritt die Ableitung t = f'(z) aufnehmen (der erste Schritt zählt nicht, bei z₀ = 0 wäre
// sie 0). LYAP 1 sammelt log|t|², den echten Exponenten. LYAP 2 sammelt log|Re t| und log|Im t| getrennt, aber nur, solange
// die Bahn im Quadrat |Re z|, |Im z| ≤ Grenze bleibt (Vorgabe: 2). Der erste gezählte Schritt zählt immer: Innen ändert das
// nichts, außen bekommt jeder Punkt den Wert aus seinem ersten Schritt wie der Streifen am Rand, statt leer zu bleiben. Die Logarithmen laufen als Produkte mit Umnormierung mit: kein log je Schritt.
fn lyNimm(ly: ptr<function, vec4f>, n: ptr<function, u32>, drin: ptr<function, bool>, z: vec2f, t: vec2f, nimm: bool) {
  if (LYAP == 2u) {
    if (!(*drin)) { return; }

      if (!nimm) { return; }                     // z₀ zählt nie

    }                                            // Streifen am Rand nahtlos fort, statt dort Weiß zu lassen

fn lyAus(ly: vec4f, n: u32) -> u32 {   // Wert für den zweiten Ausgabekanal: λ als f32 bzw. die zwei Teile nach Re und Im als f16

  if (LYAP == 3u) { return pack2x16float(clamp(vec2f(0.5 * (ly.y + log(ly.x)), ly.w) / nn, vec2f(-6.0e4), vec2f(6.0e4))); }   // (λ, mittlere Drehung in rad)

  return pack2x16float(clamp(vec2f(A + B, B - A) / (2.0 * nn), vec2f(-6.0e4), vec2f(6.0e4)));   // Summe geteilt durch n + n·i
}

// Abstand zu den Achsen; 2 dasselbe je Achse getrennt; 3 Streifenmittel: Mittel von ½ + ½·sin(5·arg z);
// 4 Dreiecksmittel: Lage von |z| zwischen den Grenzen der Dreiecksungleichung ||w| − |c|| … |w| + |c| mit w = z − c,
// dem Teil vor dem Addieren von c; 5 Vorzeichenwechsel: wie oft Re z und Im z das Vorzeichen wechseln. zv = das z davor.
fn stNimm(st: ptr<function, vec4f>, n: ptr<function, u32>, z: vec2f, zv: vec2f, cc: vec2f, nimm: bool) {

  else if (STAT == 2u) { s.x = min(s.x, abs(z.x)); s.y = min(s.y, abs(z.y)); }

}
fn stAus(st: vec4f, n: u32, r2: f32, bail: f32) -> u32 {   // Wert für den zweiten Ausgabekanal
  let nn = f32(max(n, 1u));
  if (STAT == 1u) { return bitcast<u32>(st.x); }
  if (STAT == 2u) { return pack2x16float(clamp(log(max(st.xy, vec2f(1.0e-30))), vec2f(-6.0e4), vec2f(6.0e4))); }   // log-Abstände

fn t1(z: vec2f, f: u32) -> vec2f {

// Zufallsversatz der adaptiven Glättung: gaußverteilt um die Pixelmitte (σ = P.extra.x, bei 3 σ abgeschnitten), aus einem
// Hash von Pixel und Durchlauf, damit jede Probe eines Pixels an anderer Stelle liegt und der Filter in der Verteilung steckt.
// mische() ist ein 32-Bit-Mischer der verbreiteten Bauart Verschieben, Einmischen, Malnehmen; die Konstanten stammen aus
// tools/hash-suche.js. hash3 verrührt die drei Eingaben
// verschachtelt, die zwei Zahlen einer Probe kommen aus 2·seed und 2·seed + 1.
fn mische(x: u32) -> u32 {
  var h = x;
  h ^= h >> 17u; h *= 0x7b03334bu; h ^= h >> 14u; h *= 0x39475235u; h ^= h >> 16u;
  return h;
}
fn hash3(p: vec3u) -> u32 { return mische(p.x ^ mische(p.y ^ mische(p.z))); }
// Gaußverteilt um die Pixelmitte, σ = P.extra.x, bei 3 σ abgeschnitten. Beim schnellen Verfahren (adapt = 2) kommen die
// beiden Zufallszahlen nicht aus einem Streuwerk, sondern aus der R2-Folge: aufeinanderfolgende Proben rücken um die
// Kehrwerte der plastischen Zahl weiter und decken das Pixel darum gleichmäßig ab, statt zu klumpen. Jedes Pixel dreht
// die Folge um einen eigenen Zufallswert, sonst läge in allen Pixeln dasselbe Muster.
fn jitter(px: vec2u, seed: u32) -> vec2f {
  var u1: f32; var u2: f32;
  if (P.adapt == 2u) {
    let dreh = vec2f(f32(hash3(vec3u(px, 5u)) >> 8u), f32(hash3(vec3u(px, 9u)) >> 8u)) * (1.0 / 16777216.0);
    let k = f32(seed);
    u1 = max(fract(dreh.x + k * 0.7548776662466927), 1.0e-7);
    u2 = fract(dreh.y + k * 0.5698402909980532);
  } else {
    u1 = (f32(hash3(vec3u(px, 2u * seed)) >> 8u) + 0.5) * (1.0 / 16777216.0);
    u2 = f32(hash3(vec3u(px, 2u * seed + 1u)) >> 8u) * (1.0 / 16777216.0);
  }
  let r = min(sqrt(-2.0 * log(u1)), 3.0) * P.extra.x;
  return vec2f(r * cos(6.2831853 * u2), r * sin(6.2831853 * u2));
}

// Schlanker Kern wie in der Urfassung: z² + c ohne Inversion, Ableitung, Zyklus und Näherung (eigene Funktion, damit
// der Prolog und Epilog des allgemeinen Shaders nicht im Registerhaushalt landen)
fn fsFast(pos: vec4f) -> vec4u {
  let dc = P.dcOffset + pos.xy * P.dcScale;
  let julia = P.isJulia == 1u;
  var d = select(vec2f(0.0), dc, julia);
  let dcc = select(dc, vec2f(0.0), julia);
  var base = 0u; var len = P.lenA; var m = 0u;
  var z = vec2f(0.0);
  for (var i = 0u; i < P.maxIter; i++) {
    var Z = Zat(base + m);
    z = Z + d;
    let r2 = dot(z, z);
    if (r2 > 1.0e4) {
      let nu = f32(i) + 1.0 - (log2(0.5 * log2(r2)) - 2.7317);
      return vec4u(u32(max(nu, 0.0) * 256.0), 0u, 0u, 1u);
    }
    if (max(abs(z.x), abs(z.y)) < max(abs(d.x), abs(d.y)) || m + 1u >= len) {
      d = z; base = P.baseB; len = P.lenB; m = 0u; Z = vec2f(0.0);
    }
    let w = 2.0 * Z + d;
    d = vec2f(d.x * w.x - d.y * w.y, d.x * w.y + d.y * w.x) + dcc;
    m++;
  }
  return vec4u(0x80000000u | u32(min(length(z), 2.0) * 16777216.0), 0u, 0u, 1u);
}

// Ausgabe: x = Iterationen (24.8) | Wurzel<<26 bzw. innen-Flag + |z|, y = Abstand zum Rand bzw. innen: log-Konvergenzrate
@fragment fn fs(@builtin(position) pos0: vec4f) -> @location(0) vec4u {
  if (P.adapt != 0u && textureLoad(need, vec2i(pos0.xy), 0).x == 0u) { discard; return vec4u(0u, 0u, 0u, 1u); }   // Pixel ist fertig
  var pos = pos0;
  if (P.jit != 0u) { pos = vec4f(pos0.xy + jitter(vec2u(pos0.xy), P.jit), pos0.zw); }
  if (FAST == 1u) { return fsFast(pos); }
  let dp = P.dcOffset + pos.xy * P.dcScale;
  var dcv = dp;
  var dcds = vec2f(P.ps, 0.0);
  if (P.invert == 1u) {
    let p = P.pRef + dp;
    dcv = -cmul(dp, cinv(cmul(P.pRef, p)));
    let ip = cinv(p);
    dcds = -P.ps * cmul(ip, ip);
  }
  var Dps = M(dcds);                                   // Ableitung der Rechenebene nach der Probe
  if (P.flip == 1u) { dcv = vec2f(dcv.x, -dcv.y); Dps = dg(1.0, -1.0) * Dps; }   // gespiegelte Ebene: c = conj(p)
  let julia = P.isJulia == 1u;
  let f = FORMULA;
  let pw = POWER;
  let de = NEED_DE == 1u;
  let ni = NEED_INT == 1u;
  let zero = mat2x2f(vec2f(0.0), vec2f(0.0));
  var DpsC = Dps; var der = zero;
  if (julia) { DpsC = zero; der = Dps; }
  var dzz = dg(1.0, 1.0); var dzzExp = 0.0;
  var z = vec2f(0.0);
  var escaped = false; var nu = 0.0; var dist = 0.0; var root = 0u;
  var i = 0u;
  var ly = vec4f(1.0, 0.0, 1.0, 0.0); var lyN = 0u; var lyDrin = true;   // Färbung nach Lyapunov-Exponent (LYAP ≠ 0)
  let bail = select(select(1.0e4, max(1.0e4, 2.0 * P.extra.y * P.extra.y), LYAP == 2u), 1.0e10, STAT == 3u || STAT == 4u);   // nach Re und Im: erst hinter der Ecke des Quadrats aufhören; Streifen- und Dreiecksmittel: großer Radius, glatter
  var st = select(vec4f(0.0), vec4f(1.0e30, 1.0e30, 0.0, 0.0), STAT <= 2u); var stN = 0u; var zAlt = vec2f(0.0);   // Bahnstatistik (STAT ≠ 0)
  let cVoll = select(P.cRef + dcv, P.cRef, julia);   // c des Punkts (Dreiecksmittel)

  if (f <= 6u) {
    // ---- Störungsrechnung mit Rebasing (Mandelbrot-Familie inkl. Betragsvarianten)
    var d = select(vec2f(0.0), dcv, julia);
    let dcc = select(dcv, vec2f(0.0), julia);
    var base = 0u; var len = P.lenA; var m = 0u; var tabB = false;
    var zc = vec2f(1.0e30); var ck = 16u; var ckNext = 16u;
    let Z0B = Zat(P.baseB);                              // Bahnanfang des Rebasing-Segments (z₀ bei Mandelbrot, 0 bei Julia)
    while (i < P.maxIter) {
      var Z = Zat(base + m);
      var r4 = 0.0;
      if (BLA == 1u) { r4 = blaR4at(base + m); }
      z = Z + d;
      let r2 = dot(z, z);
      if (select(r2 > bail, !(r2 <= bail) && lyN > 0u, LYAP != 0u)) {   // Lyapunov: der erste Schritt zählt immer
        if (STAT != 0u) { stNimm(&st, &stN, z, zAlt, cVoll, i > 0u); }   // der ausbrechende Schritt zählt mit
        nu = f32(i) + 1.0 - (log2(0.5 * log2(r2)) - 2.7317) / log2(f32(pw));
        let r = sqrt(r2);
        dist = r * log(r) / max(fnorm(der), 1.0e-30);
        escaped = true;
        break;
      }
      if (CYCLE == 1u && (i & 7u) == 0u) {
        let dz = z - zc;
        if (dot(dz, dz) < 1.0e-12 * max(r2, 1.0e-20)) { break; }
        if (i >= ckNext) { zc = z; ck = ck * 2u; ckNext = i + ck; }
      }
      if (max(abs(z.x - Z0B.x), abs(z.y - Z0B.y)) < max(abs(d.x), abs(d.y)) || m + 1u >= len) {
        d = z - Z0B; base = P.baseB; len = P.lenB; m = 0u; Z = Z0B; r4 = 0.0; tabB = P.blaMisc.w == 1u;
      }
      if (BLA == 1u) {
        // r4 ist der Radius des 4er-Blocks ab m (0, wenn m nicht durch 4 teilbar): ein Fehlversuch kostet keinen abhängigen Zugriff.
        // Die Radien fallen mit der Blockebene, darum von unten nach oben weitersuchen; der letzte Schritt bleibt regulär.
        let d2 = dot(d, d);
        if (d2 < r4 * r4) {
          let kmax = min(countTrailingZeros(m), select(P.blaMisc.y, P.blaMisc.z, tabB));
          let nS = select(P.blaN.x, P.blaN.y, tabB);
          let nn = select(P.blaN.z, P.blaN.w, tabB);
          let sb = select(0u, P.blaMisc.x, tabB);
          var best = 2u; var bestL = min(4u, nS - m); var k = 3u;
          loop {
            if (k > kmax) { break; }
            let l = min(1u << k, nS - m);
            let r = blaRad(sb + nn - (nn >> k) + (m >> k));
            if (d2 >= r * r || i + l >= P.maxIter) { break; }
            best = k; bestL = l;
            k = k + 1u;
          }
          if (i + bestL < P.maxIter) {
            let ab = blaFac(sb + nn - (nn >> best) + (m >> best));
            d = cmul(ab.xy, d) + cmul(ab.zw, dcc);
            if (de) { der = M(ab.xy) * der + M(ab.zw) * DpsC; }
            m += bestL; i += bestL;
            continue;
          }
        }
      }
      let Pp = t1(Z, f);                               // Referenz vor der Potenz
      let pT = t1delta(Z, d, f);                       // Delta vor der Potenz
      let tt = Pp + pT;                                // Pixelwert vor der Potenz
      var S = Pp + tt;                                 // (Pp+pT)^pw − Pp^pw = pT·S
      var fd = 2.0 * tt;
      if (pw != 2u) {
        var acc = vec2f(1.0, 0.0); var Zj = vec2f(1.0, 0.0); var zp = tt;
        for (var j = 1u; j < pw; j++) {
          Zj = cmul(Zj, Pp); acc = Zj + cmul(tt, acc);
          if (j > 1u) { zp = cmul(zp, tt); }
        }
        S = acc; fd = f32(pw) * zp;
      }
      if (LYAP != 0u) { lyNimm(&ly, &lyN, &lyDrin, z, fd, i > 0u); }   // fd = d·z^(d−1), die Ableitung an z
      if (STAT != 0u) { stNimm(&st, &stN, z, zAlt, cVoll, i > 0u); zAlt = z; }
      let q = cmul(pT, S);                             // Delta nach der Potenz
      var qq = q;
      var Fm = M(fd);
      if (f == 3u || f == 4u) {
        let Q = cpow(Pp, pw);
        qq = t2delta(Q, q, f);
        Fm = j2(Q + q, f) * Fm;
      }
      if (de || ni) {
        let Fj = Fm * j1(z, f);
        if (de) { der = Fj * der + DpsC; }
        if (ni && i > 0u) {
          dzz = Fj * dzz;
          let qn = 0.5 * (dot(dzz[0], dzz[0]) + dot(dzz[1], dzz[1]));
          if (qn < 1.0e-24) { dzz = dzz * 1.0e12; dzzExp -= 27.631021; }
          else if (qn > 1.0e24) { dzz = dzz * 1.0e-12; dzzExp += 27.631021; }
        }
      }
      d = qq + dcc;
      m++; i++;
    }
  } else if (f == 13u) {
    // ---- Lyapunov: Punkt (a, b) der Ebene, logistische Abbildung mit Folge aus A und B
    let ab = P.cRef + dcv;
    var x = 0.5; var lam = 0.0; var n = 0u; var k = 0u;
    let warm = P.maxIter / 5u;
    let total = warm + P.maxIter;
    for (var t = 0u; t < total; t++) {
      let r = select(ab.x, ab.y, ((P.seqBits >> k) & 1u) == 1u);
      let dv = abs(r * (1.0 - 2.0 * x));
      x = r * x * (1.0 - x);
      if (t >= warm) { lam += log(max(dv, 1.0e-30)); n++; }
      k++; if (k >= P.seqLen) { k = 0u; }
      // Nicht definiert (Marke 1e4) ist ein Punkt nur, wenn die Bahn davonläuft. Für a, b in [0, 4] bleibt sie in [0, 1]; mit
      // negativen Werten (bis −2) oder gemischt kann sie beschränkt bleiben, obwohl sie [0, 1] verlässt: alle vier Quadranten.
      // Die Grenze ist unkritisch (10 oder 1e12 ändern nur Einzelpunkte); NaN zählt als davongelaufen.
      if (!(abs(x) <= 1.0e6)) { lam = 1.0e4; n = 1u; break; }
    }
    return vec4u(0u, bitcast<u32>(lam / f32(max(n, 1u))), 0u, 1u);
  } else {
    // ---- Direkte Iteration in fp32 (Phoenix, Lambda, Sinus, Exponential, Newton/Nova, Magnet)
    let c = select(P.cRef + dcv, P.cRef, julia);
    var z0 = vec2f(0.0);
    if (f == 8u) { z0 = vec2f(0.5, 0.0); }
    if (f == 11u) { z0 = vec2f(1.0, 0.0); }
    z = select(z0, P.zRef + dcv, julia);
    var zp = vec2f(0.0);
    var Jp = mat2x2f(vec2f(0.0), vec2f(0.0));
    let one = vec2f(1.0, 0.0);
    var conv = false;
    var zc = vec2f(1.0e30); var ck = 16u; var ckNext = 16u;
    for (; i < P.maxIter; i++) {
      let r2 = dot(z, z);
      if (select(r2 > bail, !(r2 <= bail) && lyN > 0u, LYAP != 0u)) {   // Lyapunov: der erste Schritt zählt immer
        if (STAT != 0u) { stNimm(&st, &stN, z, zAlt, cVoll, i > 0u); }   // der ausbrechende Schritt zählt mit
        nu = f32(i) + 1.0 - (log2(0.5 * log2(r2)) - 2.7317) / log2(f32(pw));
        let r = sqrt(r2);
        dist = r * log(r) / max(fnorm(der), 1.0e-30);
        escaped = true;
        break;
      }
      if (CYCLE == 1u && f != 11u && (i & 7u) == 0u) {
        let dz = z - zc;
        if (dot(dz, dz) < 1.0e-12 * max(r2, 1.0e-20)) { break; }
        if (i >= ckNext) { zc = z; ck = ck * 2u; ckNext = i + ck; }
      }
      var zn = z;
      var Fm = dg(1.0, 1.0);
      var Gm = dg(1.0, 1.0);
      var stop = false;   // in WGSL verlässt break im switch nur den switch, nicht die Schleife: Abbruch danach
      switch f {
        case 7u: { zn = cmul(z, z) + c + P.param * zp; Fm = M(2.0 * z); }
        case 8u: { let w = z - cmul(z, z); zn = cmul(c, w); Fm = M(cmul(c, one - 2.0 * z)); Gm = M(w); }
        case 9u: { zn = csin(z) + c; Fm = M(ccos(z)); }
        case 10u: { let e = cexp(z); zn = e + c; Fm = M(e); }
        case 11u: {
          let zd1 = cpow(z, pw - 1u); let zd = cmul(zd1, z);
          let step = cmul(zd - one, cinv(f32(pw) * zd1));
          zn = z - P.param * step + c;
          // konvergiert, wenn z kaum noch wandert: bei Newton (c = 0) ist das der Newton-Schritt, bei Nova (c ≠ 0) der Weg
          // zum Fixpunkt, wo sich Schritt und c aufheben; relativ ab |z| > 1 und so grob, dass fp32 es sicher erreicht
          let mv = zn - z; let s2 = dot(mv, mv) / max(dot(zn, zn), 1.0);
          if (s2 < 1.0e-10) {
            let ang = atan2(zn.y, zn.x);
            root = u32(i32(round(ang * f32(pw) / 6.2831853)) + i32(pw) * 4) % pw;
            if (dot(c, c) > 0.0) { root = 0u; }        // Nova: ein Fixpunkt, keine Wurzeln zu unterscheiden
            nu = f32(i) + 1.0 - log2(max(0.5 * log(max(s2, 1.0e-30)) / log(1.0e-5), 1.0));
            conv = true; escaped = true; stop = true;
          }
        }
        case 12u: {
          let num = cmul(z, z) + c - one; let den = 2.0 * z + c - vec2f(2.0, 0.0);
          let idn = cinv(den); let g = cmul(num, idn);
          zn = cmul(g, g);
          let dz = zn - one;
          if (dot(dz, dz) < 1.0e-12) { stop = true; }  // Konvergenz gegen 1 zählt als innen
          let gp = cmul(2.0 * cmul(z, den) - 2.0 * num, cmul(idn, idn));
          Fm = M(2.0 * cmul(g, gp));
          Gm = M(2.0 * cmul(g, cmul(den - num, cmul(idn, idn))));
        }
        default: {}
      }
      if (stop) { break; }
      if (LYAP != 0u) { lyNimm(&ly, &lyN, &lyDrin, z, Fm[0], i > 0u); }   // Fm = M(f'(z)): erste Spalte ist die Ableitung
      if (STAT != 0u) { stNimm(&st, &stN, z, zAlt, cVoll, i > 0u); zAlt = z; }
      if (de) {
        var dn = Fm * der + Gm * DpsC;
        if (f == 7u) { dn = dn + P.param * Jp; Jp = der; }
        der = dn;
      }
      if (ni && i > 0u) {
        dzz = Fm * dzz;
        let qn = 0.5 * (dot(dzz[0], dzz[0]) + dot(dzz[1], dzz[1]));
        if (qn < 1.0e-24) { dzz = dzz * 1.0e12; dzzExp -= 27.631021; }
        else if (qn > 1.0e24) { dzz = dzz * 1.0e-12; dzzExp += 27.631021; }
      }
      zp = z; z = zn;
    }
  }
  if (LYAP != 0u) {   // zweiter Kanal trägt den Lyapunov-Wert statt Abstand bzw. Konvergenzrate, innen wie außen
    let xl = select(0x80000000u | u32(min(length(z), 2.0) * 16777216.0), u32(max(nu, 0.0) * 256.0) | (root << 26u), escaped);
    return vec4u(xl, lyAus(ly, lyN), 0u, 1u);
  }
  if (STAT != 0u && (escaped || STAT == 1u || STAT == 2u || STAT == 5u)) {   // Bahnstatistik im zweiten Kanal; Streifen- und Dreiecksmittel nur außen
    let xl = select(0x80000000u | u32(min(length(z), 2.0) * 16777216.0), u32(max(nu, 0.0) * 256.0) | (root << 26u), escaped);
    return vec4u(xl, stAus(st, stN, dot(z, z), bail), 0u, 1u);
  }
  if (escaped) {
    if ((WINKEL & 1u) != 0u) { return vec4u(u32(max(nu, 0.0) * 256.0) | (root << 26u), bitcast<u32>(atan2(z.y, z.x) * (1.0 / 6.2831853)), 0u, 1u); }   // Winkel von z beim Ausbruch in Umläufen (−½ … ½)
    return vec4u(u32(max(nu, 0.0) * 256.0) | (root << 26u), bitcast<u32>(dist), 0u, 1u);
  }
  if ((WINKEL & 2u) != 0u) { return vec4u(0x80000000u | u32(min(length(z), 2.0) * 16777216.0), bitcast<u32>(atan2(z.y, z.x) * (1.0 / 6.2831853)), 0u, 1u); }   // innen: Winkel des letzten Bahnpunkts
  let qn = 0.5 * (dot(dzz[0], dzz[0]) + dot(dzz[1], dzz[1]));
  let h = (0.5 * log(max(qn, 1.0e-38)) + dzzExp) / f32(max(i, 1u));
  return vec4u(0x80000000u | u32(min(length(z), 2.0) * 16777216.0), bitcast<u32>(h), 0u, 1u);
}`;

const WGSL_UPSCALE = /* wgsl */`
@group(0) @binding(0) var src: texture_2d<u32>;
@group(0) @binding(1) var<uniform> U: vec4f;      // Quellkoordinate = pos * U.xy + U.zw
@vertex fn vs(@builtin(vertex_index) vi: u32) -> @builtin(position) vec4f {
  let x = f32((vi & 1u) << 2u) - 1.0;
  let y = f32((vi & 2u) << 1u) - 1.0;
  return vec4f(x, y, 0.0, 1.0);
}
@fragment fn fs(@builtin(position) pos: vec4f) -> @location(0) vec4u {
  let sp = vec2i(floor(pos.xy * U.xy + U.zw));
  let dim = vec2i(textureDimensions(src));
  if (sp.x < 0 || sp.y < 0 || sp.x >= dim.x || sp.y >= dim.y) { return vec4u(0x80000000u, 0u, 0u, 1u); }
  return textureLoad(src, sp, 0);
}`;

const WGSL_FILL = /* wgsl */`
@vertex fn vs(@builtin(vertex_index) vi: u32) -> @builtin(position) vec4f {
  let x = f32((vi & 1u) << 2u) - 1.0;
  let y = f32((vi & 2u) << 1u) - 1.0;
  return vec4f(x, y, 0.0, 1.0);
}
@fragment fn fs() -> @location(0) vec4u { return vec4u(0xFFFFFFFFu, 0u, 0u, 1u); }`;

const WGSL_COLOR_LIB = /* wgsl */`
struct CP { a: vec4f, b: vec4f, c: vec4f, d: vec4f, misc: vec4f, misc2: vec4f, misc3: vec4f, shift: vec4f, extra: vec4f, z2: vec4f, leer: vec4f, q: array<vec4f, 20> };   // shift.xy = Versatz während des Ziehens, extra.x = Stauchung p, extra.y = Palette vorfiltern (0 = aus, sonst Faktor auf die Breite)
// zweidimensionale Palette (PAL2): z2 = (Art: 0 keine, 1 Formel, 2 Tabelle; Achse u; Achse v; –), leer.xyz = Farbe ohne Wert, q = je Quadrant a, b, cu, cv, d
@group(0) @binding(0) var iter: texture_2d_array<u32>;   // eine Ebene je Probe der Glättung
@group(0) @binding(1) var<uniform> C: CP;
@group(0) @binding(2) var cdf: texture_2d<f32>;
@group(0) @binding(3) var palTex: texture_2d<f32>;   // eigenes Farbschema: 256 Farben
@group(0) @binding(4) var accSum: texture_2d<f32>;   // adaptive Glättung: Farbsumme (rgb) und Summe der Helligkeitsquadrate (a) je Pixel
@group(0) @binding(5) var accCnt: texture_2d<f32>;   // adaptive Glättung: Zahl der Zufallsproben je Pixel
@group(0) @binding(8) var palPre: texture_2d<f32>;   // Stammfunktion des eigenen Farbschemas (257 Einträge) für die Palettenvorfilterung
@group(0) @binding(9) var pal2Tex: texture_2d<f32>;  // zweidimensionale Palette: 2 × 2 Quadranten à 256 × 256 Farben
@vertex fn vs(@builtin(vertex_index) vi: u32) -> @builtin(position) vec4f {
  let x = f32((vi & 1u) << 2u) - 1.0;
  let y = f32((vi & 2u) << 1u) - 1.0;
  return vec4f(x, y, 0.0, 1.0);
}
fn pal(t: f32) -> vec3f {
  if (C.misc3.z > 0.5) {
    let x = fract(t) * 256.0; let i = i32(x); let fr = x - f32(i);
    return mix(textureLoad(palTex, vec2i(i & 255, 0), 0).xyz, textureLoad(palTex, vec2i((i + 1) & 255, 0), 0).xyz, fr);
  }
  return clamp(C.a.xyz + C.b.xyz * cos(6.2831853 * fract(C.c.xyz * t + C.d.xyz)), vec3f(0.0), vec3f(1.0));
}
// misc = (Dichte, Versatz, Probenebenen (0 = adaptiv), Verlaufsart), misc2 = (Randmodus, Randbreite px, Innen, log2(maxIter+1))
// Höhe = log2(Abstand in Pixeln + 1) eines Nachbartexels; außerhalb, ungerechnet oder innen: Rückfallwert (kein Gefälle)
fn heightAt(xy: vec2i, k: i32, fallback: f32) -> f32 {
  let dims = vec2i(textureDimensions(iter).xy);
  if (xy.x < 0 || xy.y < 0 || xy.x >= dims.x || xy.y >= dims.y) { return fallback; }
  let q = textureLoad(iter, xy, k, 0);
  if (q.x == 0xFFFFFFFFu || (q.x & 0x80000000u) != 0u) { return fallback; }
  return log2(max(bitcast<f32>(q.y), 1.0e-6) + 1.0);
}
// Relief: der log-Abstand als Höhenfeld, beleuchtet mit Diffus- und Glanzanteil (Licht von oben links); base = Grundfarbe
fn reliefLight(xy: vec2i, k: i32, dist: f32, base: vec3f) -> vec3f {
  let h = log2(max(dist, 1.0e-6) + 1.0);
  let hx = heightAt(xy + vec2i(1, 0), k, h) - heightAt(xy - vec2i(1, 0), k, h);
  let hy = heightAt(xy + vec2i(0, 1), k, h) - heightAt(xy - vec2i(0, 1), k, h);
  let nrm = normalize(vec3f(-hx * 1.6, -hy * 1.6, 1.0));
  let light = normalize(vec3f(-0.55, 0.55 * C.misc3.w, 0.62));
  let diff = max(dot(nrm, light), 0.0);
  let spec = pow(max(dot(reflect(-light, nrm), vec3f(0.0, 0.0, 1.0)), 0.0), 28.0);
  return base * (0.3 + 0.8 * diff) + vec3f(0.4) * spec;
}
// „Relief (Abstand)“: Palette nach log-Abstand in Ebenen-Einheiten (Farbe hängt nur vom Punkt ab, nicht vom Zoom), dazu das Relief
fn distanceShade(xy: vec2i, k: i32, dist: f32) -> vec3f {
  let h = log2(max(dist, 1.0e-6) + 1.0);
  return reliefLight(xy, k, dist, pal((h + log2(max(C.shift.z, 1.0e-30))) * C.misc.x * 8.0 + C.misc.y));
}
fn itlog(x0: f32, times: u32) -> f32 {   // k-fach iterierter Logarithmus: log2(… log2(x + 1) + 1 …)
  var x = x0;
  for (var i = 0u; i < times; i++) { x = log2(x + 1.0); }
  return x;
}
// Farbanker: Abbildungswert des verankerten Iterationswerts (shift.w, negativ = kein Anker); wird von t abgezogen,
// damit die Farbe an der Ankerstelle beim Ändern der Dichte stehen bleibt und die Bänder sich nur um sie herum dehnen
fn anchorV() -> f32 {
  if (C.shift.w < 0.0) { return 0.0; }
  return mapNu(C.shift.w);
}
// Stauchung: Box-Cox (n^p − 1)/p, p = 1 linear, 0,5 Wurzel, → 0 Logarithmus, < 0 stärker als Log (sättigt); normiert bei nu = 50
fn boxcox(nu: f32) -> f32 {
  let p = C.extra.x;

fn mapNu(nu: f32) -> f32 {

fn tAt(xy: vec2i, k: i32, dims: vec2i) -> vec2f {

fn palWidth(xy: vec2i, k: i32) -> f32 {

      else { col = pal(bitcast<f32>(px.y) * C.misc.x * 25.0 + C.misc.y); }   // Standarddichte: ein Umlauf je Einheit λ

      else { col = pal(p.x + p.y + C.misc.y); }

      let p = vec2f(r * C.misc.x * 25.0, th);

    }
  } else if (u32(C.misc3.x) == 11u) {                 // Newton/Nova: jede Wurzel beginnt an ihrer Stelle der Palette,
    let root = (u >> 26u) & 7u;                        // die Schritte bis zur Konvergenz laufen wie Iterationen weiter
    let nu = f32(u & 0x03FFFFFFu) * (1.0 / 256.0);
    if (zwei) { col = farbe2(vec2f(1.0), vec2f((mapNu(nu) - anchorV()) * C.misc.x, f32(root) / max(C.misc3.y, 1.0)), false); }   // zweidimensional: Dauer und Wurzel

    if (u32(C.misc.w) == 4u) { col = distanceShade(xy, k, bitcast<f32>(px.y)); }

}

@group(0) @binding(1) var<uniform> D: DP;
@vertex fn vs(@builtin(vertex_index) vi: u32) -> @builtin(position) vec4f {

  // ---- Adaptive Glättung (Aufbau wie im WebGPU-Renderer: jit, sum[2], cnt[2], need[2], stat; Rückkopieren per Blit)
  _fTarget(fmt, W, H) {   // einlagige Textur mit Framebuffer

    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);

  async aaInit() {

  _aaAttach() {   // Ziel des Akkumulationsdurchlaufs: sum[1], cnt[1], need[0]
    const gl = this.gl, aa = this.aa;

    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, aa.sum[1].tex, 0);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT1, gl.TEXTURE_2D, aa.cnt[1].tex, 0);

  }
  aaDestroy() {

    if (aa.fboA) gl.deleteFramebuffer(aa.fboA);
  }
  _blit(from, to, r) {
    const gl = this.gl;
    gl.bindFramebuffer(gl.READ_FRAMEBUFFER, from.fbo); gl.bindFramebuffer(gl.DRAW_FRAMEBUFFER, to.fbo);
    gl.blitFramebuffer(r.sx, r.sy, r.sx + r.w, r.sy + r.h, r.dx, r.dy, r.dx + r.w, r.dy + r.h, gl.COLOR_BUFFER_BIT, gl.NEAREST);
  }
  _aaPass(rects, cp, ap) {

    gl.uniform4f(u.uAP, ap[0], ap[1], ap[2], ap[3]); gl.uniform4f(u.uAQ, ap[4], ap[5], ap[6], ap[7]);
    gl.enable(gl.SCISSOR_TEST);

    gl.disable(gl.SCISSOR_TEST);
    for (const r of rects) { const c = { sx: r.x, sy: r.y, dx: r.x, dy: r.y, w: r.w, h: r.h }; this._blit(aa.sum[1], aa.sum[0], c); this._blit(aa.cnt[1], aa.cnt[0], c); }

  aaDone(rects) { this._aaPass(rects, this._cpNull(), aaUniform(null, 3)); }              // Bedarf auf 0: außerhalb der Exportkachel
  _cpNull() { return this._cpZero || (this._cpZero = { a: [0, 0, 0], b: [0, 0, 0], c: [0, 0, 0], d: [0, 0, 0], density: 0, offset: 0, layers: 0, mapping: 0, glowMode: 0, glowWidth: 1, interior: 0, histL: 1, formula: 0, roots: 2 }); }
  exportColorFromScreen(cp, w, h) {   // Kachel aus den Bildschirmpuffern einfärben (adaptiver Export) und zurücklesen
    this._colorPass(this.exColor.fbo, cp, this.full.tex, w, h);
    const img = this._readFlipped(w, h);
    this.gl.bindFramebuffer(this.gl.FRAMEBUFFER, null);

  }
  aaRefresh(cp, ap) { this._aaPass([{ x: 0, y: 0, w: this.W, h: this.H }], cp, aaUniform(ap, 1)); }
  aaRefine(rects, p, cp, ap) {
    this.renderFractal('jit', rects, p);
    this._aaPass(rects, cp, aaUniform(ap, 0));
  }
  aaShift(sx, sy, strips) {
    const gl = this.gl, aa = this.aa, w = this.W - Math.abs(sx), h = this.H - Math.abs(sy);
    const c = { sx: Math.max(0, -sx), sy: Math.max(0, -sy), dx: Math.max(0, sx), dy: Math.max(0, sy), w, h };
    for (const pair of [aa.sum, aa.cnt, aa.need]) { this._blit(pair[0], pair[1], c); pair.reverse(); }
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);

  }
  aaStats() {
    const gl = this.gl, aa = this.aa, W = this.W, H = this.H;
    gl.bindFramebuffer(gl.FRAMEBUFFER, aa.stat.fbo);
    gl.viewport(0, 0, TILES_N, TILES_N);
    gl.useProgram(this.progS); gl.bindVertexArray(this.vao);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, aa.need[0].tex); gl.uniform1i(this.uS.uNeed, 0);

    gl.readPixels(0, 0, TILES_N, TILES_N, gl.RGBA_INTEGER, gl.UNSIGNED_INT, px);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    const out = new Uint32Array(TILES_N * TILES_N);
    for (let i = 0; i < out.length; i++) out[i] = px[4 * i];
    return Promise.resolve(out);
  }
  setCdf(data) {
    const gl = this.gl;
    gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, this.cdfTex);
    gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, CDF_N, 1, gl.RED, gl.FLOAT, data, 0);
  }
  setPalette2(tab) {
    const gl = this.gl;
    gl.activeTexture(gl.TEXTURE7); gl.bindTexture(gl.TEXTURE_2D, this.pal2Tex);
    gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, 2 * PAL2_N, 2 * PAL2_N, gl.RGBA, gl.FLOAT, tab, 0);
  }
  setPalette(lut) {
    const gl = this.gl;
    gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D, this.palTex);
    gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, 256, 1, gl.RGBA, gl.UNSIGNED_BYTE, lut, 0);
    gl.activeTexture(gl.TEXTURE6); gl.bindTexture(gl.TEXTURE_2D, this.palPreTex);
    gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, 257, 1, gl.RGBA, gl.FLOAT, palPrefix(lut), 0);
  }
  readRegion(w, h) {
    const gl = this.gl;
    gl.bindFramebuffer(gl.FRAMEBUFFER, this.preview.fbo[0]);
    const px = new Uint32Array(w * h * 4);
    gl.readPixels(0, 0, w, h, gl.RGBA_INTEGER, gl.UNSIGNED_INT, px);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    const out = new Uint32Array(w * h);
    for (let i = 0; i < w * h; i++) out[i] = px[4 * i];
    return Promise.resolve(out);
  }
  _rgbaTarget(w, h) {
    const gl = this.gl;
    const tex = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.texStorage2D(gl.TEXTURE_2D, 1, gl.RGBA8, w, h);
    const fbo = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
    return { tex, fbo };
  }
  _readFlipped(w, h) {
    const gl = this.gl, px = new Uint8ClampedArray(w * h * 4);
    gl.readPixels(0, 0, w, h, gl.RGBA, gl.UNSIGNED_BYTE, px);
    const out = new Uint8ClampedArray(w * h * 4), row = w * 4;
    for (let y = 0; y < h; y++) out.set(px.subarray(y * row, (y + 1) * row), (h - 1 - y) * row);
    return new ImageData(out, w, h);
  }
  beginExport(tw, th, aa) {
    this.exIter = this._iterTarget(tw, th, aa * aa);
    this.exColor = this._rgbaTarget(tw, th);
    this.gl.bindFramebuffer(this.gl.FRAMEBUFFER, null);
  }
  renderExportTile(params, cp, w, h) {   // params: ein Parametersatz je Probenebene
    params.forEach((p, k) => this.renderFractal('export', [{ x: 0, y: 0, w, h }], p, k));
    this._colorPass(this.exColor.fbo, cp, this.exIter.tex, w, h);

  endExport() {

  }
  present(cp) { this._colorPass(null, cp); }
  // ---- Akkumulation: Zähltextur aus CPU-Workern, Anzeige per Shader
  async accInit(W, H) {
    const gl = this.gl;
    if (!this.progAcc) {
      this.progAcc = this._program(GLSL_VS, GLSL_ACCDISP);
      this.uAcc = {}; for (const n of ['uCounts', 'uNorm', 'uMisc']) this.uAcc[n] = gl.getUniformLocation(this.progAcc, n);

  accClear() { this.accCounts.fill(0); }   // nur die Zähler; die Anzeige behält ihr Bild bis zum nächsten Hochladen
  accUpload() {
    const gl = this.gl;
    gl.bindTexture(gl.TEXTURE_2D, this.accTex);
    gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, this.accStride, this.accH, gl.RGBA_INTEGER, gl.UNSIGNED_INT, this.accCounts, 0);
  }
  accReadNorm() { return Promise.resolve(accPercentile(this.accCounts, this.accW, this.accH, this.accStride)); }
  _accDisp(fbo, dp) {
    const gl = this.gl, u = this.uAcc;
    gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
    gl.viewport(0, 0, this.W, this.H);
    gl.useProgram(this.progAcc); gl.bindVertexArray(this.vao);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, this.accTex); gl.uniform1i(u.uCounts, 0);

  accReadImage(dp) {

  }
  accDestroy() { if (this.accTex) { this.gl.deleteTexture(this.accTex); this.accTex = null; } this.accCounts = null; }

    const gl = this.gl;
    const sync = gl.fenceSync(gl.SYNC_GPU_COMMANDS_COMPLETE, 0);
    gl.flush();

    return new Promise(res => {
      const poll = () => {

  async readImage(cp) {
    const gl = this.gl, W = this.W, H = this.H;

    const ext = this.gl.getExtension('WEBGL_lose_context');

function accPercentile(a, W, H, stride) {   // Perzentil je Kanal über jede 3. Zeile/Spalte: 99,9 % oder das der Punktwolke
  const vals = [[], [], [], []];
  for (let y = 0; y < H; y += 3) for (let x = 0; x < W; x += 3) {
    const i = (y * stride + x) * 4;
    for (let ch = 0; ch < 4; ch++) { const v = a[i + ch]; if (v > 0) vals[ch].push(v); }
  }
  const q = CLOUDS[CLOUD_KEYS[S.accKind]].perzentil || 0.999;
  return vals.map(v => { if (!v.length) return 1; v.sort((p, r) => p - r); return Math.max(1, v[Math.min(v.length - 1, Math.floor(v.length * q))]); });
}

const CLOUDS = {

  dejong:   { kind: 1, view: [0, 0, 0.7], prm: [2, 1.5, -1.5, -2], labels: ['a', 'b', 'c', 'd'] },
  pickover: { kind: 2, prm: [2.7, 1.3, -0.8, 1.1], labels: ['a', 'b', 'c', 'd'] },
  ikone:    { kind: 3, prm: [-2.5, 2.3, 0.05, 0.2, 0.05, 7], labels: ['λ', 'α', 'β', 'γ', 'ω', 'n'],
              bereiche: [[-3, 3], [-3, 5], [-1, 1], [-1, 1], [-0.5, 0.5], [3, 9]], ganz: 5, lauf: { steps: 3000, warm: 200, start: [-0.3, -0.3, 0.6, 0.6] } },
  // Hopalong ist in der Mitte viel dichter als außen: die Helligkeitsskala am 97. statt am 99,9. Perzentil, sonst bliebe das Muster dunkel

  gumowski: { kind: 5, prm: [0.25, 1], labels: ['a', 'b'], bereiche: [[-1, 1], [0.9, 1.1]], lauf: { steps: 15000, warm: 0, start: [-12, -12, 24, 24] } },

const CLOUD_KEYS = Object.keys(CLOUDS);
const DEFAULT_VIEW = {
  get accum() { const c = CLOUDS[CLOUD_KEYS[S.accKind]], v = c.view; return v ? { cx: v[0], cy: v[1], zoom: v[2] } : wolkenAnsicht(c); },
  get mandel() {
    if (S.invert) return { cx: 0, cy: 0, zoom: 0.6 };

  get julia() {
    const jv = FORMULAS[S.formula].jview;

// Handy: das Blatt am Kopf ziehen. Nach oben geht es ganz auf, nach unten erst auf halbe Höhe und dann zu; Tippen wechselt.
(() => {
  const p = $('panel'), head = p.querySelector('.panel-head');
  let id = null, y0 = 0, h0 = 0, dy = 0;
  head.addEventListener('pointerdown', e => {
    if (!mobileNarrow() || e.target.closest('button') || p.classList.contains('collapsed')) return;
    id = e.pointerId; y0 = e.clientY; dy = 0; h0 = p.getBoundingClientRect().height;
    try { head.setPointerCapture(id); } catch (err) { /* ohne Fang geht es auch, solange der Finger auf dem Kopf bleibt */ }
    p.classList.add('ziehen');
  });
  head.addEventListener('pointermove', e => {
    if (e.pointerId !== id) return;
    dy = e.clientY - y0;
    if (dy < 0) { p.style.maxHeight = Math.min(window.innerHeight - $('tabbar').offsetHeight - 56, h0 - dy) + 'px'; p.style.transform = ''; }
    else { p.style.maxHeight = ''; p.style.transform = 'translateY(' + dy + 'px)'; }
  });
  const ende = e => {
    if (e.pointerId !== id) return;
    id = null; p.classList.remove('ziehen'); p.style.maxHeight = ''; p.style.transform = '';
    if (Math.abs(dy) < 6) p.classList.toggle('expanded');
    else if (dy < -40) p.classList.add('expanded');
    else if (dy > 60) { if (p.classList.contains('expanded') && dy < h0 / 2) p.classList.remove('expanded'); else togglePanel(); }
  };
  head.addEventListener('pointerup', ende); head.addEventListener('pointercancel', ende);

// ---- Werte tippen statt schieben --------------------------------------------------------------------------------
// Jede Wertanzeige neben einem Regler ist ein Eingabefeld. Getippter Text wird auf die Reglerstellung zurückgerechnet
// und dem Regler als sein eigenes input-Ereignis untergeschoben: Jede Änderung läuft damit durch denselben Weg wie das
// Schieben, und kein Regler braucht seine Logik ein zweites Mal. Enter oder Verlassen übernimmt, Esc verwirft.
function leseZahl(text) {
  // Einheiten und Zusätze („%“, „px“, „×“) werden überlesen. Bei den Trennzeichen entscheidet die Sprache: Ein einzelnes
  // Trennzeichen mit genau drei Ziffern dahinter ist ein Tausenderpunkt, wenn es in dieser Sprache einer ist – so wird
  // im Deutschen „1.500“ zu 1500 und „1,5“ zu 1,5, im Englischen umgekehrt. Bei mehreren zählt nur das letzte.
  const roh = String(text).replace(/[\s\u00A0\u202F]/g, '');

  const istTausender = teile[teile.length - 1].length === 3 && (teile.length > 2 || letztesTrenn === tausender);
  return vz * +(istTausender ? teile.join('') : teile.slice(0, -1).join('') + '.' + teile[teile.length - 1]);

<h4>16. Legal basis for the processing</h4>
 <p>Art. 6(1) lit. a GDPR serves as the legal basis for processing operations for which we obtain consent for a specific processing purpose. If the processing of personal data is necessary for the performance of a contract to which the data subject is party, as is the case, for example, when processing operations are necessary for the supply of goods or to provide any other service, the processing is based on Article 6(1) lit. b GDPR. The same applies to such processing operations which are necessary for carrying out pre-contractual measures, for example in the case of inquiries concerning our products or services. Is our company subject to a legal obligation by which processing of personal data is required, such as for the fulfillment of tax obligations, the processing is based on Art. 6(1) lit. c GDPR. In rare cases, the processing of personal data may be necessary to protect the vital interests of the data subject or of another natural person. This would be the case, for example, if a visitor were injured in our company and his name, age, health insurance data or other vital information would have to be passed on to a doctor, hospital or other third party. Then the processing would be based on Art. 6(1) lit. d GDPR. Finally, processing operations could be based on Article 6(1) lit. f GDPR. This legal basis is used for processing operations which are not covered by any of the abovementioned legal grounds, if processing is necessary for the purposes of the legitimate interests pursued by our company or by a third party, except where such interests are overridden by the interests or fundamental rights and freedoms of the data subject which require protection of personal data. Such processing operations are particularly permissible because they have been specifically mentioned by the European legislator. He considered that a legitimate interest could be assumed if the data subject is a client of the controller (Recital 47 Sentence 2 GDPR).</p>
 
<h4>17. The legitimate interests pursued by the controller or by a third party</h4>
 <p>Where the processing of personal data is based on Article 6(1) lit. f GDPR our legitimate interest is to carry out our business in favor of the well-being of all our employees and the shareholders.</p>
